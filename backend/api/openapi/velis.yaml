openapi: 3.1.0
info:
  title: Velis API
  version: 0.1.0
  description: Velis HTTP API 契约入口。业务端点将在对应里程碑中增量加入。
servers:
  - url: /api/v1
paths:
  /me/agent/conversations:
    post:
      operationId: createAgentConversation
      summary: 创建本人空会话
      description: 仅auth与agent同时启用时注册。认证→基本格式→归属/删除→幂等→版本/配额；失败使用中文error.message和request_id。无Redis、OpenSearch、RabbitMQ或模型依赖。省略title使用“新对话”；默认每用户50个会话，支持1–500。固定24h幂等，重放原201和ETag，满配额可重放。
      security:
      - bearerAuth: []
      responses:
        '201':
          description: 创建本人空会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConversation'
          headers:
            ETag:
              description: 响应快照title_version的强ETag，仅用于改名，不表示消息集合版本。
              schema:
                type: string
                pattern: ^"[1-9][0-9]*"$
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentCreateInput'
    get:
      operationId: listAgentConversations
      summary: 分页读取本人会话
      description: 仅auth与agent同时启用时注册。认证→基本格式→归属/删除→幂等→版本/配额；失败使用中文error.message和request_id。无Redis、OpenSearch、RabbitMQ或模型依赖。按(last_activity_at,id)倒序实时keyset分页，不冻结跨页集合，活跃移动可能跨越旧边界。空items为[]。
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 分页读取本人会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConversationPage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
        description: 省略为20；显式空值、0、重复及未知参数拒绝。
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          maxLength: 4096
        description: 独立认证加密游标，绑定账户、用途及历史会话；首查绝对期限默认1h，续页允许改变limit但不续期。显式空值、篡改、跨作用域或到期返回INVALID_CURSOR。
  /me/agent/conversations/{id}:
    get:
      operationId: getAgentConversation
      summary: 读取本人会话元数据
      description: 仅auth与agent同时启用时注册。认证→基本格式→归属/删除→幂等→版本/配额；失败使用中文error.message和request_id。无Redis、OpenSearch、RabbitMQ或模型依赖。不包含消息正文或最后消息片段。
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 读取本人会话元数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConversation'
          headers:
            ETag:
              description: 响应快照title_version的强ETag，仅用于改名，不表示消息集合版本。
              schema:
                type: string
                pattern: ^"[1-9][0-9]*"$
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: 会话UUID；不存在、删除或非本人统一404，管理员无豁免。
    patch:
      operationId: renameAgentConversation
      summary: 手动修改本人会话标题
      description: 仅auth与agent同时启用时注册。认证→基本格式→归属/删除→幂等→版本/配额；失败使用中文error.message和request_id。无Redis、OpenSearch、RabbitMQ或模型依赖。实际改名增加title_version并更新活跃时间；无变化仍检查版本，但不更新版本/活跃时间。重放优先于当前版本且返回原200快照。
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 手动修改本人会话标题
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConversation'
          headers:
            ETag:
              description: 响应快照title_version的强ETag，仅用于改名，不表示消息集合版本。
              schema:
                type: string
                pattern: ^"[1-9][0-9]*"$
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: 会话UUID；不存在、删除或非本人统一404，管理员无豁免。
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
          pattern: ^"[1-9][0-9]*"$
        description: 预期title_version的强ETag，拒绝重复、弱版本、列表、通配符、前导零及溢出。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRenameInput'
    delete:
      operationId: deleteAgentConversation
      summary: 不可恢复删除本人整会话
      description: 仅auth与agent同时启用时注册。认证→基本格式→归属/删除→幂等→版本/配额；失败使用中文error.message和request_id。无Redis、OpenSearch、RabbitMQ或模型依赖。无正文，不要求幂等键或If-Match。原子物理删除消息/会话、释放配额并清除所有关联幂等成功正文，保留仅会话UUID/账户UUID/删除时间的永久最小标记。本人重复删除204，未知/他人404。
      security:
      - bearerAuth: []
      responses:
        '204':
          description: 不可恢复删除本人整会话
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: 会话UUID；不存在、删除或非本人统一404，管理员无豁免。
  /me/agent/conversations/{id}/messages:
    get:
      operationId: listAgentMessages
      summary: 向前分页读取本人消息历史
      description: 仅auth与agent同时启用时注册。认证→基本格式→归属/删除→幂等→版本/配额；失败使用中文error.message和request_id。无Redis、OpenSearch、RabbitMQ或模型依赖。最近消息首查，sequence倒序选批后批内升序返回；下一页sequence小于本批最小序号。65条历史默认依次46–65、26–45；追加不改变旧边界，空/末页next_cursor=null。
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 向前分页读取本人消息历史
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentMessagePage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: 会话UUID；不存在、删除或非本人统一404，管理员无豁免。
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
        description: 省略为20；显式空值、0、重复及未知参数拒绝。
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          maxLength: 4096
        description: 独立认证加密游标，绑定账户、用途及历史会话；首查绝对期限默认1h，续页允许改变limit但不续期。显式空值、篡改、跨作用域或到期返回INVALID_CURSOR。
    post:
      operationId: appendAgentMessage
      summary: 追加不可变用户消息
      description: 仅auth与agent同时启用时注册。认证→基本格式→归属/删除→幂等→版本/配额；失败使用中文error.message和request_id。无Redis、OpenSearch、RabbitMQ或模型依赖。角色固定user，不自动回复；默认每会话200条（user与assistant共计），可配1–2000。正文有效UTF-8，仅CRLF/CR转LF，保留所有其它格式；默认4000
        code point，可配1–16000。拒绝NUL、空/全空白、非法编码和未配对Unicode转义，超长不截断。消息body预算max(64KiB,12×max_message_chars+4KiB)，硬上限256KiB。固定24h幂等，规范化正文摘要，重放原ID/序号/201。
      security:
      - bearerAuth: []
      responses:
        '201':
          description: 追加不可变用户消息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentMessage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: 会话UUID；不存在、删除或非本人统一404，管理员无豁免。
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentMessageInput'
  /me/article-feedback:
    get:
      operationId: getMyArticleFeedback
      summary: 批量读取本人对当前公开文章的反馈状态
      security:
        - bearerAuth: []
      parameters:
        - name: article_ids
          in: query
          required: true
          description: 逗号分隔的 1 至 50 个互异正整数文章 ID；下架或不存在的文章从结果省略，顺序与请求一致。
          schema:
            type: string
            pattern: '^[1-9][0-9]*(,[1-9][0-9]*){0,49}$'
      responses:
        "200":
          description: 本人反馈状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleFeedbackPage"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /me/articles/{article_id}/reads:
    post:
      operationId: recordMyArticleRead
      summary: 记录本人对当前公开文章的站内详情阅读
      description: 无请求正文；服务端按 UTC 固定半小时窗口合并重复阅读。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ArticleID"
      responses:
        "204":
          description: 已记录或已在同一窗口记录
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /me/articles/{article_id}/favorite:
    put:
      operationId: setMyArticleFavorite
      summary: 收藏当前公开文章
      description: 无请求正文；重复设置不会增加权重。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ArticleID"
      responses:
        "204":
          description: 已收藏
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
    delete:
      operationId: clearMyArticleFavorite
      summary: 取消本人收藏
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ArticleID"
      responses:
        "204":
          description: 已取消或原本未收藏
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /me/articles/{article_id}/not-interested:
    put:
      operationId: setMyArticleNotInterested
      summary: 标记当前公开文章为不感兴趣
      description: 无请求正文；首次设置有效 180 天，有效期内重复设置不续期。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ArticleID"
      responses:
        "204":
          description: 已标记
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
    delete:
      operationId: clearMyArticleNotInterested
      summary: 撤销本人不感兴趣标记
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ArticleID"
      responses:
        "204":
          description: 已撤销或原本未标记
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /ping:
    get:
      operationId: ping
      summary: 验证 API 路由可用
      responses:
        "200":
          description: API 可用
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                    const: pong
  /articles:
    get:
      operationId: listArticles
      summary: 按有效发布时间倒序读取文章
      description: >-
        按有效发布时间和文章 ID 倒序，使用既有 v2 不透明键集游标。
        启用 Redis 时 latest ID 候选正常情况下约 5 秒收敛；实际返回卡片的公开状态、
        当前修订及 AI 选择仍由 PostgreSQL 复核，详情直接读取当前公开修订。
        每次最多检查 500 个候选；达到上限可能返回短页或空页且 has_more=true，
        客户端必须依 next_cursor 推进，不以 items 数量判断结束。有效 lookahead 不被消费。
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
          description: 服务端生成的不透明分页游标
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: 文章分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticlePage"
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /articles/recommend:
    get:
      operationId: recommendArticles
      summary: 读取匿名或本人个性化的公开推荐 Feed
      description: >-
        limit 默认 20，范围 1–50；重复参数返回 VALIDATION_FAILED。无凭证为匿名，
        携带失效凭证返回既有认证错误。无有效正向画像按 PostgreSQL latest 冷启动；
        有画像时每路最多召回 100 条、冻结去重后最多 200 条。OpenSearch 整体故障回退 latest，
        候选不足时以 latest 补位；启用 Redis 时推荐首查排序计划按服务端认证的真实用户身份隔离，
        正常约 30 秒候选排序窗口，命中不续期；每次首查有独立时间/消费状态，
        仍复核当前公开/语义身份及本人有效排除，排除签名变化重算。
        匿名/无画像不使用计划缓存，latest_fallback 与依赖失败不缓存；
        Redis 故障不单独改变 mode/degraded，清缓存不影响有效游标续页。
        当前卡片使用共享读取缓存。推荐游标与搜索游标隔离，绝对有效期默认 2 分钟，
        续页继续冻结候选顺序但每页复核当前公开状态和本人有效负反馈；游标失效返回 INVALID_CURSOR。
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          description: 服务端生成的推荐专用不透明游标；切换身份或过期后须从第一页重试。
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: 公开推荐页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleRecommendPage"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /articles/{article_id}:
    get:
      operationId: getArticle
      summary: 读取单篇已发布文章，携带清洗后的正文 HTML
      parameters:
        - name: article_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 文章详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleDetail"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /search/articles:
    get:
      operationId: searchArticles
      summary: 搜索当前公开文章（可选 BM25/KNN 混合召回）
      description: >-
        对现有文本投影执行 BM25，并在返回前由 PostgreSQL 复核当前公开事实。
        cursor 绑定规范化查询与短期 PIT；过期或不匹配时返回 INVALID_CURSOR。
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: keyword
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 64
          description: 精确匹配索引中的关键词值
        - name: topic
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 64
          description: 精确匹配索引中的主题值
        - name: source_id
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
          description: 精确来源过滤；不匹配站内投稿
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 16384
          description: 服务端生成、绑定当前规范化查询与短期 PIT 的不透明游标
      responses:
        "200":
          description: 公开文章搜索页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleSearchPage"
        "400":
          description: 参数越界（VALIDATION_FAILED）或游标非法/过期（INVALID_CURSOR）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: 搜索后端不可用（SEARCH_UNAVAILABLE）或 PostgreSQL 复核失败（DEPENDENCY_UNAVAILABLE）
          headers:
            Retry-After:
              description: 建议重试等待秒数
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /me/articles:
    get:
