openapi: 3.1.0
info:
  title: Velis API
  version: 0.1.0
  description: Velis HTTP API 契约入口。业务端点将在对应里程碑中增量加入。
servers:
  - url: /api/v1
paths:
  /ping:
    get:
      operationId: ping
      summary: 验证 API 路由可用
      responses:
        "200":
          description: API 可用
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                    const: pong
  /livez:
    get:
      servers:
        - url: /
      operationId: live
      summary: 进程存活检查
      responses:
        "200":
          $ref: "#/components/responses/HealthOK"
  /readyz:
    get:
      servers:
        - url: /
      operationId: ready
      summary: 必要依赖与排流状态检查
      responses:
        "200":
          $ref: "#/components/responses/HealthOK"
        "503":
          $ref: "#/components/responses/Error"
components:
  responses:
    HealthOK:
      description: 健康
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status:
                type: string
                const: ok
    Error:
      description: 统一错误响应
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
