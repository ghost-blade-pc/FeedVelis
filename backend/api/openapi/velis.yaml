components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 访问令牌只驻留内存，有效期 15 分钟且不超过会话剩余期限。
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Host-velis_refresh
      description: 生产使用 __Host-velis_refresh（HttpOnly; Secure; SameSite=Strict; Path=/）；本地开发为 velis_refresh 且 Secure=false。
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: 服务端生成的不透明分页游标
    ArticlePageLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    SourcePageLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    FetchRunPageLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    ArticleID:
      name: article_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    AssetID:
      name: asset_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SourceID:
      name: source_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 同一调用者和操作内唯一的 UUID；成功结果默认可重放 24 小时。
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 当前聚合强 ETag，格式为双引号包裹的十进制 lock_version。
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
  headers:
    ETag:
      description: 聚合当前 lock_version 的强 ETag。
      required: true
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    ObjectETag:
      description: 对象存储返回的内容 ETag。
      required: true
      schema:
        type: string
  responses:
    HealthOK:
      description: 健康
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status:
                type: string
                const: ok
    Error:
      description: 统一错误响应
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    AgentConversation:
      type: object
      additionalProperties: false
      required:
      - id
      - title
      - title_version
      - message_count
      - created_at
      - last_activity_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 100
        title_version:
          type: integer
          format: int64
          minimum: 1
        message_count:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
          description: UTC RFC3339
        last_activity_at:
          type: string
          format: date-time
          description: UTC RFC3339
    AgentMessage:
      type: object
      additionalProperties: false
      required:
      - id
      - conversation_id
      - sequence
      - role
      - content
      - created_at
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        sequence:
          type: integer
          format: int64
          minimum: 1
        role:
          type: string
          enum:
          - user
          - assistant
        content:
          type: string
          minLength: 1
          maxLength: 16000
          description: 规范化正文code point长度；默认配置上限4000，保留首尾空白及Markdown。
        created_at:
          type: string
          format: date-time
          description: UTC RFC3339
    AgentCreateInput:
      type: object
      additionalProperties: false
      description: 4KiB以内严格JSON，拒绝重复键、null、未知字段、非法UTF-8、未配对代理项及尾随JSON。
      properties:
        title:
          type: string
          minLength: 1
          description: 省略为新对话；显式标题TrimSpace后1–100 code point，必须为单行且不含控制字符。
    AgentRenameInput:
      type: object
      additionalProperties: false
      required:
      - title
      properties:
        title:
          type: string
          minLength: 1
          description: TrimSpace后1–100 code point，单行且不含控制字符。拒绝null/重复/未知字段；body至多4KiB。
    AgentMessageInput:
      type: object
      additionalProperties: false
      required:
      - content
      properties:
        content:
          type: string
          minLength: 1
          description: 仅接受正文；拒绝role、user_id、序号、资源ID或时间等伪造字段及null。
    AgentConversationPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      - has_more
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AgentConversation'
        next_cursor:
          type:
          - string
          - 'null'
          maxLength: 4096
        has_more:
          type: boolean
    AgentMessagePage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      - has_more
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AgentMessage'
        next_cursor:
          type:
          - string
          - 'null'
          maxLength: 4096
        has_more:
          type: boolean
    ArticleFeedbackPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ArticleFeedbackState"
    ArticleFeedbackState:
      type: object
      additionalProperties: false
      required: [article_id, favorited, not_interested, not_interested_expires_at]
      properties:
        article_id:
          type: integer
          format: int64
          minimum: 1
        favorited:
          type: boolean
        not_interested:
          type: boolean
        not_interested_expires_at:
          type: [string, "null"]
          format: date-time
          description: 未标记或已过期时为 null。
    ArticlePage:
      type: object
      required: [items, next_cursor, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ArticleItem"
        next_cursor:
          type: [string, "null"]
          description: has_more=true 时使用此游标继续；包含已检查位置，空页也可推进。
        has_more:
          type: boolean
          description: 是否仍有候选可检查；不保证下一页非空。
    ArticleSearchPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ArticleItem"
        next_cursor:
          type: [string, "null"]
        has_more:
          type: boolean
    ArticleRecommendPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, has_more, mode, degraded]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ArticleRecommendItem"
        next_cursor:
          type: [string, "null"]
        has_more:
          type: boolean
        mode:
          type: string
          enum: [personalized, cold_start, latest_fallback]
        degraded:
          type: boolean
    ArticleRecommendItem:
      allOf:
        - $ref: "#/components/schemas/ArticleItem"
        - type: object
          required: [recommendation_reason]
          properties:
            recommendation_reason:
              type: string
              enum: [keyword_match, topic_match, similar_content, recent, latest_fallback]
    ArticleItem:
      type: object
      required: [id, title, excerpt, published_at, origin, enhancement]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        excerpt:
          type: string
        published_at:
          type: string
          format: date-time
          description: latest 使用的有效发布时间；RSS 原站时间优先，缺失时回退固定站内发布时间。
        origin:
          $ref: "#/components/schemas/ArticleOrigin"
        enhancement:
          oneOf:
            - $ref: "#/components/schemas/ArticleEnhancement"
            - type: "null"
          description: 当前修订选中的内容增强结果；未生成、失败或仅旧修订存在结果时为 null。
    ArticleEnhancement:
      type: object
      required: [summary, keywords, topics, method, generated_at]
      additionalProperties: false
      properties:
        summary:
          type: string
          minLength: 1
          maxLength: 1000
        keywords:
          type: array
          minItems: 1
          maxItems: 12
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 64
        topics:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 64
        method:
          type: string
          enum: [model, extractive]
          description: model 为模型生成，extractive 为模型非法输出重试耗尽后的原文摘录。
        generated_at:
          type: string
          format: date-time
    ArticleSource:
      type: object
      required: [id, title, site_url]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        site_url:
          type: [string, "null"]
          format: uri
    ArticleOrigin:
      oneOf:
        - $ref: "#/components/schemas/RSSArticleOrigin"
        - $ref: "#/components/schemas/UserArticleOrigin"
      discriminator:
        propertyName: type
        mapping:
          rss: "#/components/schemas/RSSArticleOrigin"
          user: "#/components/schemas/UserArticleOrigin"
    RSSArticleOrigin:
      type: object
      required: [type, source, canonical_url, source_published_at]
      properties:
        type:
          type: string
          const: rss
        source:
          $ref: "#/components/schemas/ArticleSource"
        canonical_url:
          type: string
          format: uri
          pattern: "^https?://"
        source_published_at:
          type: [string, "null"]
          format: date-time
    UserArticleOrigin:
      type: object
      required: [type, author]
      properties:
        type:
          type: string
          const: user
        author:
          $ref: "#/components/schemas/ArticleAuthor"
    ArticleAuthor:
      type: object
      required: [id, nickname]
      properties:
        id:
          type: string
          format: uuid
        nickname:
          type: string
    ArticleDetail:
      allOf:
        - $ref: "#/components/schemas/ArticleItem"
        - type: object
          required: [content_html]
          properties:
            content_html:
              type: string
              description: 经来源对应策略清洗的当前公开修订正文 HTML
    ArticleStatus:
      type: string
      enum: [draft, published, offline, deleted]
    OfflineReason:
      type: [string, "null"]
      enum: [author, admin, null]
    MyArticlePage:
      type: object
      required: [items, next_cursor, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MyArticleSummary"
        next_cursor:
          type: [string, "null"]
        has_more:
          type: boolean
    MyArticleSummary:
      type: object
      required: [id, title, status, offline_reason, revision_no, lock_version, published_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        status:
          $ref: "#/components/schemas/ArticleStatus"
        offline_reason:
          $ref: "#/components/schemas/OfflineReason"
        revision_no:
          type: integer
          minimum: 1
        lock_version:
          type: integer
          format: int64
          minimum: 1
        published_at:
          type: [string, "null"]
          format: date-time
        updated_at:
          type: string
          format: date-time
    MyArticleDetail:
      allOf:
        - $ref: "#/components/schemas/MyArticleSummary"
        - type: object
          required: [markdown, content_html, excerpt, asset_ids]
          properties:
            markdown:
              type: string
              maxLength: 262144
            content_html:
              type: string
            excerpt:
              type: string
            asset_ids:
              type: array
              maxItems: 20
              items:
                type: string
                format: uuid
    CreateArticleRequest:
      type: object
      additionalProperties: false
      required: [title, markdown, initial_status]
      properties:
        title:
          type: string
          maxLength: 200
        markdown:
          type: string
          maxLength: 262144
        initial_status:
          type: string
          enum: [draft, published]
    UpdateArticleRequest:
      type: object
      additionalProperties: false
      required: [title, markdown]
      properties:
        title:
          type: string
          maxLength: 200
        markdown:
          type: string
          maxLength: 262144
    PreviewArticleRequest:
      type: object
      additionalProperties: false
      required: [title, markdown]
      properties:
        title:
          type: string
          maxLength: 200
        markdown:
          type: string
          maxLength: 262144
    ArticlePreview:
      type: object
      required: [content_html, plain_text, excerpt, asset_ids]
      properties:
        content_html:
          type: string
        plain_text:
          type: string
        excerpt:
          type: string
        asset_ids:
          type: array
          maxItems: 20
          items:
            type: string
            format: uuid
    AdminArticleResult:
      type: object
      required: [id, status, offline_reason, lock_version, published_at]
      properties:
        id:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/ArticleStatus"
        offline_reason:
          $ref: "#/components/schemas/OfflineReason"
        lock_version:
          type: integer
          format: int64
          minimum: 1
        published_at:
          type: string
          format: date-time
    CreateAssetRequest:
      type: object
      additionalProperties: false
      required: [content_type, size_bytes]
      properties:
        content_type:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 10485760
    AssetUpload:
      type: object
      required: [asset, upload_url, upload_method, upload_headers, expires_at]
      properties:
        asset:
          $ref: "#/components/schemas/ArticleAsset"
        upload_url:
          type: string
          format: uri
          description: 15 分钟有效、使用部署配置的公共上传端点签发且可由 Web 客户端访问的对象存储预签名地址；不属于匿名读取契约。
        upload_method:
          type: string
          const: PUT
        upload_headers:
          type: object
          additionalProperties:
            type: string
        expires_at:
          type: string
          format: date-time
    ArticleAsset:
      type: object
      required: [id, status, content_type, size_bytes, width, height, checksum, created_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, ready, delete_pending, deleted]
        content_type:
          type: [string, "null"]
          enum: [image/jpeg, image/png, image/webp, null]
        size_bytes:
          type: [integer, "null"]
          format: int64
        width:
          type: [integer, "null"]
          maximum: 8192
        height:
          type: [integer, "null"]
          maximum: 8192
        checksum:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        confirmed_at:
          type: [string, "null"]
          format: date-time
    SourcePage:
      type: object
      required: [items, next_cursor, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminSource"
        next_cursor:
          type: [string, "null"]
        has_more:
          type: boolean
    AdminSource:
      type: object
      required:
        - id
        - feed_url
        - title
        - status
        - fetch_interval_seconds
        - lock_version
        - next_fetch_at
        - consecutive_failures
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        feed_url:
          type: string
          format: uri
          pattern: "^https?://"
          description: 创建后不可修改，且不得含凭据。
        title:
          type: string
        status:
          type: string
          enum: [active, paused, degraded]
        fetch_interval_seconds:
          type: integer
          minimum: 300
          maximum: 86400
          default: 1800
        lock_version:
          type: integer
          format: int64
          minimum: 1
        next_fetch_at:
          type: [string, "null"]
          format: date-time
        last_success_at:
          type: [string, "null"]
          format: date-time
        consecutive_failures:
          type: integer
          minimum: 0
        last_error_code:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateSourceRequest:
      type: object
      additionalProperties: false
      required: [feed_url]
      properties:
        feed_url:
          type: string
          format: uri
          pattern: "^https?://"
        fetch_interval_seconds:
          type: integer
          minimum: 300
          maximum: 86400
          default: 1800
    UpdateSourceRequest:
      type: object
      additionalProperties: false
      required: [fetch_interval_seconds]
      properties:
        fetch_interval_seconds:
          type: integer
          minimum: 300
          maximum: 86400
    SourceFetchRunPage:
      type: object
      required: [items, next_cursor, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SourceFetchRun"
        next_cursor:
          type: [string, "null"]
        has_more:
          type: boolean
    SourceFetchRun:
      type: object
      required:
        - id
        - source_id
        - trigger
        - status
        - not_modified
        - inserted_count
        - updated_count
        - unchanged_count
        - skipped_count
        - started_at
      properties:
        id:
          type: string
          format: uuid
        source_id:
          type: integer
          format: int64
        trigger:
          type: string
          enum: [scheduled, manual]
        status:
          type: string
          enum: [running, succeeded, failed, aborted]
        not_modified:
          type: boolean
        inserted_count:
          type: integer
          minimum: 0
        updated_count:
          type: integer
          minimum: 0
        unchanged_count:
          type: integer
          minimum: 0
        skipped_count:
          type: integer
          minimum: 0
        error_code:
          type: [string, "null"]
        started_at:
          type: string
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: >-
                统一错误码。认证相关：AUTH_INVALID_CREDENTIALS、AUTH_SESSION_INVALID、
                AUTH_REGISTRATION_DISABLED、AUTH_USERNAME_CONFLICT、AUTH_RATE_LIMITED、
                AUTH_HASH_BUSY、CSRF_REJECTED、FORBIDDEN；内容与并发：
                IDEMPOTENCY_KEY_REQUIRED、IDEMPOTENCY_KEY_INVALID、
                IDEMPOTENCY_KEY_REUSED、IDEMPOTENCY_IN_PROGRESS、
                IF_MATCH_REQUIRED、IF_MATCH_INVALID、
                ARTICLE_VERSION_CONFLICT、ARTICLE_ADMIN_OFFLINE、ARTICLE_INVALID_STATE、
                ARTICLE_CONTENT_INVALID、ARTICLE_ASSET_INVALID、ASSET_QUOTA_EXCEEDED、
                ASSET_PENDING_LIMIT_EXCEEDED、ASSET_UNAVAILABLE、SOURCE_VERSION_CONFLICT、
                SOURCE_ALREADY_EXISTS、SOURCE_FETCH_IN_PROGRESS、SOURCE_FETCH_FAILED；
                Agent会话：AGENT_CONVERSATION_NOT_FOUND、AGENT_TITLE_VERSION_CONFLICT、
                AGENT_CONVERSATION_LIMIT_EXCEEDED、AGENT_MESSAGE_LIMIT_EXCEEDED、INVALID_CURSOR；
                通用：VALIDATION_FAILED、NOT_FOUND、NOT_READY、INTERNAL_ERROR、
                INVALID_CURSOR、SEARCH_UNAVAILABLE、DEPENDENCY_UNAVAILABLE。
            message:
              type: string
            request_id:
              type: string
    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: 3～32 位半角字符，首位英文字母，后续字母、数字或下划线；按 ASCII 小写规范化。
        password:
          type: string
          description: 8～20 位半角可打印字符（0x21～0x7E），四类字符至少三类，且不在常见密码表中。
        nickname:
          type: [string, "null"]
          description: 省略时使用规范化用户名；显式空值校验失败。
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    UpdateNicknameRequest:
      type: object
      required: [nickname]
      properties:
        nickname:
          type: string
          description: 1～32 个 Unicode 码点，去除首尾空白后非空，禁止换行与控制字符。
    Account:
      type: object
      required: [id, username, nickname, role, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        nickname:
          type: string
        role:
          type: string
          enum: [user, admin]
        status:
          type: string
          enum: [active, disabled]
        created_at:
          type: string
          format: date-time
    SessionResponse:
      type: object
      required: [access_token, expires_at, account]
      properties:
        access_token:
          type: string
          description: 只驻留内存的访问令牌；刷新令牌仅通过 HttpOnly Cookie 传递。
        expires_at:
          type: string
          format: date-time
        account:
          $ref: "#/components/schemas/Account"
