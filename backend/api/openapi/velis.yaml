openapi: 3.1.0
info:
  title: Velis API
  version: 0.1.0
  description: Velis HTTP API 契约入口。业务端点将在对应里程碑中增量加入。
servers:
  - url: /api/v1
paths:
  /ping:
    get:
      operationId: ping
      summary: 验证 API 路由可用
      responses:
        "200":
          description: API 可用
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                    const: pong
  /articles:
    get:
      operationId: listArticles
      summary: 按发布时间或收录时间倒序读取文章
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
          description: 服务端生成的不透明分页游标
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: 文章分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticlePage"
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /livez:
    get:
      servers:
        - url: /
      operationId: live
      summary: 进程存活检查
      responses:
        "200":
          $ref: "#/components/responses/HealthOK"
  /readyz:
    get:
      servers:
        - url: /
      operationId: ready
      summary: 必要依赖与排流状态检查
      responses:
        "200":
          $ref: "#/components/responses/HealthOK"
        "503":
          $ref: "#/components/responses/Error"
components:
  responses:
    HealthOK:
      description: 健康
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status:
                type: string
                const: ok
    Error:
      description: 统一错误响应
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ArticlePage:
      type: object
      required: [items, next_cursor, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ArticleItem"
        next_cursor:
          type: [string, "null"]
        has_more:
          type: boolean
    ArticleItem:
      type: object
      required: [id, title, canonical_url, source, author_name, excerpt, source_published_at, discovered_at]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        canonical_url:
          type: string
          format: uri
          pattern: "^https?://"
        source:
          $ref: "#/components/schemas/ArticleSource"
        author_name:
          type: [string, "null"]
        excerpt:
          type: string
        source_published_at:
          type: [string, "null"]
          format: date-time
        discovered_at:
          type: string
          format: date-time
    ArticleSource:
      type: object
      required: [id, title, site_url]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        site_url:
          type: [string, "null"]
          format: uri
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
