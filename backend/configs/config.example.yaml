app:
  name: velis
  environment: development
  log_level: info

http:
  address: 0.0.0.0:8080
  shutdown_timeout: 10s

database:
  # 敏感环境请使用 VELIS_DATABASE_URL 覆盖，不要提交真实密码。
  url: postgres://velis:velis@localhost:5432/velis?sslmode=disable
  connect_timeout: 5s
  max_connections: 20
  min_connections: 2

worker:
  heartbeat_interval: 30s
  shutdown_timeout: 30s
  metrics_address: 127.0.0.1:9091

rabbitmq:
  # 留空时 Relay/Consumer 禁用，文章事务仍写 Outbox。
  url: ""

relay:
  batch_size: 100
  publish_window: 16
  lease: 30s
  scan_interval: 1s
  confirm_timeout: 10s
  backoff_min: 1s
  backoff_max: 60s

consumer:
  prefetch: 16
  backoff_min: 1s
  backoff_max: 30s

outbox:
  retention: 168h
  cleanup_interval: 1h
  cleanup_batch: 500

# AI 内容增强默认关闭。任一 profile 启用时，provider/base_url/api_key/model/profile_version
# 必须完整提供；真实密钥只通过对应 VELIS_AI_*_API_KEY 注入。
ai:
  generation:
    provider: ""
    base_url: ""
    api_key: ""
    model: ""
    profile_version: generation-v2
    timeout: 30s
    budget: 2m
    workflow_version: hierarchical-v2
    prompt_version: summary-v2
    # 默认仅通过 Prompt 请求严格 JSON；确认 Provider 兼容后可选 json_object 或 json_schema。
    structured_output_mode: prompt
    # 输出上限参数名，默认 max_tokens（兼容性最高）；Provider 只认 max_completion_tokens 时改这里。
    # 参数名不匹配时 Provider 会忽略上限，导致输出无界、单次调用拖到超时。
    max_tokens_parameter: max_tokens
    single_input_chars: 12000
    chunk_chars: 6000
    map_summary_max_chars: 800
    repair_input_max_chars: 16000
    max_chunks: 8
    chunk_concurrency: 2
    max_calls: 9
    max_attempts: 3
    backoff_min: 5s
    backoff_max: 5m
    max_output_tokens: 3072
    audit_token_budget: 20000
    summary_max_chars: 1000
    keyword_max_count: 12
    topic_max_count: 5
    label_max_chars: 64
  embedding:
    provider: ""
    base_url: ""
    api_key: ""
    model: ""
    profile_version: embedding-v2
    timeout: 20s
    budget: 30s
    input_version: retrieval-document-v1
    # 启用 Embedding 时必须设置为服务实际返回维度。
    dimensions: 0
    # 固定维度模型保持 false；仅可变维度且明确兼容的 Provider 才发送 dimensions。
    request_dimensions: false
    max_input_chars: 12000
    max_attempts: 3
    backoff_min: 5s
    backoff_max: 5m
    audit_token_budget: 10000
  worker:
    lease: 2m
    poll_interval: 1s
    batch_size: 8

# 私有文章图片存储。endpoint 留空时资产能力局部降级；RSS、latest、Source 管理和纯文本投稿仍可用。
assets:
  # 服务端内部连接使用 host:port；启用时公共上传端点也必须配置。
  endpoint: ""
  # 浏览器可达的完整 HTTP(S) origin，不得带凭据、查询、片段或路径前缀。
  upload_endpoint: ""
  bucket: velis-article-assets
  # 真实对象存储凭据只通过 VELIS_ASSET_ACCESS_KEY / VELIS_ASSET_SECRET_KEY 注入。
  access_key: ""
  secret_key: ""
  use_tls: false
  # MinIO Bucket CORS 只允许这个精确 Web Origin；启用 endpoint 时必填。
  web_origin: ""
  upload_ttl: 15m
  pending_ttl: 24h
  unbound_ttl: 168h
  max_file_bytes: 10485760
  max_width: 8192
  max_height: 8192
  max_pixels: 40000000
  user_quota_bytes: 1073741824
  pending_limit: 20
  article_image_limit: 20
  article_bytes_limit: 52428800

idempotency:
  retention: 24h

feed:
  # 默认忽略 HTTP_PROXY/HTTPS_PROXY/ALL_PROXY 并受限直连。只有此专用配置会启用可信代理；
  # 可含凭据，但不要提交真实值，优先通过 VELIS_FEED_PROXY_URL 注入。
  proxy_url: ""

# 认证配置。默认关闭，关闭时不注册认证路由，保持原有匿名行为。
# 示例是本地开发取值（development + localhost），不能直接当作生产模板：
# 生产必须使用 __Host- Cookie（cookie_secure: true）与精确的 https 来源。
auth:
  enabled: false
  registration_enabled: false
  access_ttl: 15m
  session_ttl: 168h
  jwt_issuer: velis-api
  jwt_audience: velis-web
  # 真实密钥只通过 VELIS_AUTH_JWT_ACTIVE_KEY 注入：Base64、解码后至少 32 字节，不要提交到仓库。
  jwt_active_kid: ""
  jwt_active_key: ""
  # 轮换期间成对提供上一把密钥，确认所有实例切换后再移除。
  jwt_previous_kid: ""
  jwt_previous_key: ""
  # 精确同源来源：本地开发为 http://localhost:5173，生产为 https 来源。
  allowed_origin: ""
  cookie_secure: true
  # 限流查找键同样只通过 VELIS_AUTH_THROTTLE_KEY 注入。
  throttle_key: ""
  # 部署在反向代理之后时必须填写反代自身的地址：本仓库 Compose 把 velis-web 固定为
  # 172.30.0.10，因此本地取其 /32（见 compose.yaml 的 velis-web.networks），生产填反代地址。
  # 只填反代自己的地址、不要填整个子网：子网还包含网桥网关，客户端流量从发布端口进来时的源地址
  # 正是网关，把网关列为可信会让客户端伪造的转发头被采纳，IP 维度限流可被绕过。
  # 留空会把所有用户合并成同一个 IP 维度，30 次失败即可全局锁死登录。
  trusted_proxy_cidrs: []
  # 保留期清理由 velis-worker 执行，仅在 enabled 为 true 时启动：
  # 每 interval 一轮，每批最多 batch 条；保留期按规范固定（失败事件 30 分钟、
  # 过期限制 24 小时、会话与刷新令牌 7 天），用户与管理审计不参与清理。
  cleanup_interval: 1h
  cleanup_batch: 500
  throttle:
    account_window: 15m
    account_limit: 5
    ip_window: 15m
    ip_limit: 30
    block_duration: 15m
  argon2:
    memory_kib: 19456
    iterations: 2
    parallelism: 1
    salt_bytes: 16
    key_bytes: 32
    # 每个 API 进程同时执行的散列数，超出的请求立即返回 503，不排队。
    concurrency: 1

