server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://velis-api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-ID $request_id;
  }

  location = /livez {
    proxy_pass http://velis-api:8080/livez;
  }

  location = /readyz {
    proxy_pass http://velis-api:8080/readyz;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
