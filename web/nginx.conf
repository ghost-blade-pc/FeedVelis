server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://velis-api:8080;
    proxy_set_header Host $host;
    # 本项目的 nginx 是入口代理，前面没有其它反向代理，因此必须用 $remote_addr 覆盖客户端自带的
    # X-Forwarded-For。用 $proxy_add_x_forwarded_for 追加会保留客户端前缀，下游按「取最右不可信跳点」
    # 解析时会把它当成来源 IP，客户端即可伪造 IP、轮换 IP 维度限流额度。
    # 若将来在 nginx 前再加一层反向代理，需改回追加语义，并把该层地址加入 auth.trusted_proxy_cidrs。
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Request-ID $request_id;
  }

  location = /livez {
    proxy_pass http://velis-api:8080/livez;
  }

  location = /readyz {
    proxy_pass http://velis-api:8080/readyz;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
