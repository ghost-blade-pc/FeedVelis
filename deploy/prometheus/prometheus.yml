global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: velis-worker
    static_configs:
      - targets: ["velis-worker:9091"]
  - job_name: velis-api
    static_configs:
      - targets: ["velis-api:9090"]
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
