name: velis

x-backend-environment: &backend-environment
  VELIS_APP_ENVIRONMENT: development
  VELIS_LOG_LEVEL: info
  VELIS_DATABASE_URL: postgres://${POSTGRES_USER:-velis}:${POSTGRES_PASSWORD:-velis}@postgres:5432/${POSTGRES_DB:-velis}?sslmode=disable
  VELIS_DATABASE_CONNECT_TIMEOUT: 10s
  VELIS_AUTH_ENABLED: ${VELIS_AUTH_ENABLED:-false}
  VELIS_AUTH_REGISTRATION_ENABLED: ${VELIS_AUTH_REGISTRATION_ENABLED:-false}
  VELIS_AUTH_JWT_ACTIVE_KID: ${VELIS_AUTH_JWT_ACTIVE_KID:-}
  VELIS_AUTH_JWT_ACTIVE_KEY: ${VELIS_AUTH_JWT_ACTIVE_KEY:-}
  VELIS_AUTH_ALLOWED_ORIGIN: ${VELIS_AUTH_ALLOWED_ORIGIN:-}
  VELIS_AUTH_COOKIE_SECURE: ${VELIS_AUTH_COOKIE_SECURE:-true}
  VELIS_AUTH_THROTTLE_KEY: ${VELIS_AUTH_THROTTLE_KEY:-}
  VELIS_ASSET_ENDPOINT: minio:9000
  VELIS_ASSET_UPLOAD_ENDPOINT: ${VELIS_ASSET_UPLOAD_ENDPOINT:-http://localhost:9000}
  VELIS_ASSET_BUCKET: ${MINIO_ASSET_BUCKET:-velis-article-assets}
  VELIS_ASSET_ACCESS_KEY: ${MINIO_ROOT_USER:-velis}
  VELIS_ASSET_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-velis-development-only}
  VELIS_ASSET_USE_TLS: "false"
  VELIS_ASSET_WEB_ORIGIN: ${VELIS_ASSET_WEB_ORIGIN:-http://localhost:5173}
  VELIS_FEED_PROXY_URL: ${VELIS_FEED_PROXY_URL:-}
  VELIS_RABBITMQ_URL: ${VELIS_RABBITMQ_URL:-amqp://velis:velis-development-only@rabbitmq:5672/velis}

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-velis}
      POSTGRES_USER: ${POSTGRES_USER:-velis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-velis}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-velis} -d ${POSTGRES_DB:-velis}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-velis}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-velis-development-only}
      RABBITMQ_DEFAULT_VHOST: velis
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./deploy/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./deploy/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./deploy/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  # 固定 3.8.0：搜索投影的 schema 与分析器行为必须可复现，不能用 latest 漂移。
  # 单节点、禁用演示安全配置、只发布到本机端口：开发环境不做认证边界，生产必须用 HTTPS 与显式凭据。
  opensearch:
    image: opensearchproject/opensearch:3.8.0
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-velis}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-velis-development-only}
      # 社区版 MinIO 不实现 BucketCORS API，只支持服务级 CORS；这里限制为单一精确 Web Origin。
      MINIO_API_CORS_ALLOW_ORIGIN: ${VELIS_ASSET_WEB_ORIGIN:-http://localhost:5173}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    # 复用 MinIO 服务镜像内置的 mc，避免额外维护客户端镜像版本。
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-velis}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-velis-development-only}
      MINIO_ASSET_BUCKET: ${MINIO_ASSET_BUCKET:-velis-article-assets}
      MINIO_WEB_ORIGIN: ${VELIS_ASSET_WEB_ORIGIN:-http://localhost:5173}
    volumes:
      - ./deploy/minio/init.sh:/usr/local/bin/velis-minio-init:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/velis-minio-init"]
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  velis-migrate:
    build:
      context: ./backend
      args:
        APP: velis-migrate
    environment: *backend-environment
    command: ["-path", "/app/migrations", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  velis-api:
    build:
      context: ./backend
      args:
        APP: velis-api
    environment:
      <<: *backend-environment
      VELIS_HTTP_ADDRESS: 0.0.0.0:8080
      VELIS_HTTP_METRICS_ADDRESS: 0.0.0.0:9090
      # API 只获得查询客户端；显式空 endpoints 同样禁用查询并保持路由返回 503。
      VELIS_SEARCH_ENDPOINTS: ${VELIS_SEARCH_ENDPOINTS-http://opensearch:9200}
      VELIS_SEARCH_USERNAME: ${VELIS_SEARCH_USERNAME-}
      VELIS_SEARCH_PASSWORD: ${VELIS_SEARCH_PASSWORD-}
      VELIS_SEARCH_INDEX_PREFIX: ${VELIS_SEARCH_INDEX_PREFIX-velis-articles}
      VELIS_SEARCH_QUERY_TIMEOUT: ${VELIS_SEARCH_QUERY_TIMEOUT-3s}
      VELIS_SEARCH_QUERY_PIT_KEEP_ALIVE: ${VELIS_SEARCH_QUERY_PIT_KEEP_ALIVE-2m}
      VELIS_SEARCH_QUERY_CANDIDATE_BATCH_SIZE: ${VELIS_SEARCH_QUERY_CANDIDATE_BATCH_SIZE-100}
      VELIS_SEARCH_QUERY_MAX_CANDIDATES_PER_REQUEST: ${VELIS_SEARCH_QUERY_MAX_CANDIDATES_PER_REQUEST-500}
      # 不提供示例密钥；development 会生成内存临时键，生产必须显式注入共享 Base64 密钥。
      VELIS_SEARCH_CURSOR_KEY: ${VELIS_SEARCH_CURSOR_KEY-}
      # velis-web 的 nginx 反代 /api：只有把反代自身的地址列为可信代理，IP 维度限流才按真实客户端隔离。
      # 留空会让所有用户共用一个 IP 来源，30 次失败即可全局锁死登录。
      # 这里用反代容器的固定地址而不是整个子网：子网还包含网桥网关，而客户端流量从发布端口进来时
      # 的源地址正是网关；把网关也列为可信会让客户端自带的前缀成为「最右不可信跳点」，可伪造来源 IP。
      VELIS_AUTH_TRUSTED_PROXY_CIDRS: ${VELIS_AUTH_TRUSTED_PROXY_CIDRS:-172.30.0.10/32}
    ports:
      - "8080:8080"
    depends_on:
      velis-migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 15s

  velis-worker:
    build:
      context: ./backend
      args:
        APP: velis-worker
    environment:
      <<: *backend-environment
      VELIS_WORKER_METRICS_ADDRESS: 0.0.0.0:9091
      # AI profile 只注入实际调用模型的 Worker，避免 API 与迁移容器持有模型密钥。
      # 两组 profile 均为空时内容增强执行器保持关闭，不影响其它后台组件。
      VELIS_AI_GENERATION_PROVIDER: ${VELIS_AI_GENERATION_PROVIDER:-}
      VELIS_AI_GENERATION_BASE_URL: ${VELIS_AI_GENERATION_BASE_URL:-}
      VELIS_AI_GENERATION_API_KEY: ${VELIS_AI_GENERATION_API_KEY:-}
      VELIS_AI_GENERATION_MODEL: ${VELIS_AI_GENERATION_MODEL:-}
      VELIS_AI_GENERATION_PROFILE_VERSION: ${VELIS_AI_GENERATION_PROFILE_VERSION:-generation-v2}
      VELIS_AI_GENERATION_TIMEOUT: ${VELIS_AI_GENERATION_TIMEOUT:-30s}
      VELIS_AI_GENERATION_BUDGET: ${VELIS_AI_GENERATION_BUDGET:-2m}
      VELIS_AI_GENERATION_WORKFLOW_VERSION: ${VELIS_AI_GENERATION_WORKFLOW_VERSION:-hierarchical-v2}
      VELIS_AI_GENERATION_PROMPT_VERSION: ${VELIS_AI_GENERATION_PROMPT_VERSION:-summary-v2}
      VELIS_AI_GENERATION_STRUCTURED_OUTPUT_MODE: ${VELIS_AI_GENERATION_STRUCTURED_OUTPUT_MODE:-prompt}
      VELIS_AI_GENERATION_MAX_TOKENS_PARAMETER: ${VELIS_AI_GENERATION_MAX_TOKENS_PARAMETER:-max_tokens}
      VELIS_AI_GENERATION_SINGLE_INPUT_CHARS: ${VELIS_AI_GENERATION_SINGLE_INPUT_CHARS:-12000}
      VELIS_AI_GENERATION_CHUNK_CHARS: ${VELIS_AI_GENERATION_CHUNK_CHARS:-6000}
      VELIS_AI_GENERATION_MAP_SUMMARY_MAX_CHARS: ${VELIS_AI_GENERATION_MAP_SUMMARY_MAX_CHARS:-800}
      VELIS_AI_GENERATION_REPAIR_INPUT_MAX_CHARS: ${VELIS_AI_GENERATION_REPAIR_INPUT_MAX_CHARS:-16000}
      VELIS_AI_GENERATION_MAX_CHUNKS: ${VELIS_AI_GENERATION_MAX_CHUNKS:-8}
      VELIS_AI_GENERATION_CHUNK_CONCURRENCY: ${VELIS_AI_GENERATION_CHUNK_CONCURRENCY:-2}
      VELIS_AI_GENERATION_MAX_CALLS: ${VELIS_AI_GENERATION_MAX_CALLS:-9}
      VELIS_AI_GENERATION_MAX_ATTEMPTS: ${VELIS_AI_GENERATION_MAX_ATTEMPTS:-3}
      VELIS_AI_GENERATION_BACKOFF_MIN: ${VELIS_AI_GENERATION_BACKOFF_MIN:-5s}
      VELIS_AI_GENERATION_BACKOFF_MAX: ${VELIS_AI_GENERATION_BACKOFF_MAX:-5m}
      VELIS_AI_GENERATION_MAX_OUTPUT_TOKENS: ${VELIS_AI_GENERATION_MAX_OUTPUT_TOKENS:-3072}
      VELIS_AI_GENERATION_AUDIT_TOKEN_BUDGET: ${VELIS_AI_GENERATION_AUDIT_TOKEN_BUDGET:-20000}
      VELIS_AI_GENERATION_SUMMARY_MAX_CHARS: ${VELIS_AI_GENERATION_SUMMARY_MAX_CHARS:-1000}
      VELIS_AI_GENERATION_KEYWORD_MAX_COUNT: ${VELIS_AI_GENERATION_KEYWORD_MAX_COUNT:-12}
      VELIS_AI_GENERATION_TOPIC_MAX_COUNT: ${VELIS_AI_GENERATION_TOPIC_MAX_COUNT:-5}
      VELIS_AI_GENERATION_LABEL_MAX_CHARS: ${VELIS_AI_GENERATION_LABEL_MAX_CHARS:-64}
      VELIS_AI_EMBEDDING_PROVIDER: ${VELIS_AI_EMBEDDING_PROVIDER:-}
      VELIS_AI_EMBEDDING_BASE_URL: ${VELIS_AI_EMBEDDING_BASE_URL:-}
      VELIS_AI_EMBEDDING_API_KEY: ${VELIS_AI_EMBEDDING_API_KEY:-}
      VELIS_AI_EMBEDDING_MODEL: ${VELIS_AI_EMBEDDING_MODEL:-}
      VELIS_AI_EMBEDDING_PROFILE_VERSION: ${VELIS_AI_EMBEDDING_PROFILE_VERSION:-embedding-v2}
      VELIS_AI_EMBEDDING_TIMEOUT: ${VELIS_AI_EMBEDDING_TIMEOUT:-20s}
      VELIS_AI_EMBEDDING_BUDGET: ${VELIS_AI_EMBEDDING_BUDGET:-30s}
      VELIS_AI_EMBEDDING_INPUT_VERSION: ${VELIS_AI_EMBEDDING_INPUT_VERSION:-retrieval-document-v1}
      VELIS_AI_EMBEDDING_DIMENSIONS: ${VELIS_AI_EMBEDDING_DIMENSIONS:-0}
      VELIS_AI_EMBEDDING_REQUEST_DIMENSIONS: ${VELIS_AI_EMBEDDING_REQUEST_DIMENSIONS:-false}
      VELIS_AI_EMBEDDING_MAX_INPUT_CHARS: ${VELIS_AI_EMBEDDING_MAX_INPUT_CHARS:-12000}
      VELIS_AI_EMBEDDING_MAX_ATTEMPTS: ${VELIS_AI_EMBEDDING_MAX_ATTEMPTS:-3}
      VELIS_AI_EMBEDDING_BACKOFF_MIN: ${VELIS_AI_EMBEDDING_BACKOFF_MIN:-5s}
      VELIS_AI_EMBEDDING_BACKOFF_MAX: ${VELIS_AI_EMBEDDING_BACKOFF_MAX:-5m}
      VELIS_AI_EMBEDDING_AUDIT_TOKEN_BUDGET: ${VELIS_AI_EMBEDDING_AUDIT_TOKEN_BUDGET:-10000}
      VELIS_AI_WORKER_LEASE: ${VELIS_AI_WORKER_LEASE:-2m}
      VELIS_AI_WORKER_POLL_INTERVAL: ${VELIS_AI_WORKER_POLL_INTERVAL:-1s}
      VELIS_AI_WORKER_BATCH_SIZE: ${VELIS_AI_WORKER_BATCH_SIZE:-8}
      # 搜索投影只注入 Worker 与本地管理命令。用 ${VAR-default} 而不是 ${VAR:-default}：
      # 显式写成空值时表示「未配置 OpenSearch」，投影组件保持禁用。
      VELIS_SEARCH_ENDPOINTS: ${VELIS_SEARCH_ENDPOINTS-http://opensearch:9200}
      VELIS_SEARCH_INDEX_PREFIX: ${VELIS_SEARCH_INDEX_PREFIX-velis-articles}
      VELIS_SEARCH_SCHEMA_VERSION: ${VELIS_SEARCH_SCHEMA_VERSION-1}
      VELIS_SEARCH_EMBEDDING_DIMENSIONS: ${VELIS_SEARCH_EMBEDDING_DIMENSIONS-1024}
    depends_on:
      velis-migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    stop_grace_period: 15s

  velis-web:
    build:
      context: ./web
    networks:
      default:
        # 固定地址：velis-api 的 VELIS_AUTH_TRUSTED_PROXY_CIDRS 默认值指向这个 /32，
        # 只有反代自己可信，网关与其它容器都不在可信范围内。
        ipv4_address: 172.30.0.10
    ports:
      - "5173:8080"
    depends_on:
      velis-api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.8.1
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.3.0
    profiles: ["observability"]
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana

networks:
  # 固定子网：velis-api 的 VELIS_AUTH_TRUSTED_PROXY_CIDRS 默认值必须指向确定的反代地址。
  # 不固定时子网由 Docker 动态分配，默认值会悄悄指向另一个网段，IP 维度限流退化为全局共享
  # （所有用户共用一份额度，30 次失败即可锁死登录）。
  # 若本机 172.30.0.0/24 已被占用，compose 会直接报错而不是静默跑起来：
  # 改这里的 subnet，并同步改 velis-web 的固定地址与 velis-api 的可信代理默认值。
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  postgres-data:
  minio-data:
  rabbitmq-data:
  grafana-data:
  opensearch-data:
