name: velis

x-backend-environment: &backend-environment
  VELIS_APP_ENVIRONMENT: development
  VELIS_LOG_LEVEL: info
  VELIS_DATABASE_URL: postgres://${POSTGRES_USER:-velis}:${POSTGRES_PASSWORD:-velis}@postgres:5432/${POSTGRES_DB:-velis}?sslmode=disable
  VELIS_DATABASE_CONNECT_TIMEOUT: 10s

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-velis}
      POSTGRES_USER: ${POSTGRES_USER:-velis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-velis}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-velis} -d ${POSTGRES_DB:-velis}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-velis}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-velis-development-only}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  velis-migrate:
    build:
      context: ./backend
      args:
        APP: velis-migrate
    environment: *backend-environment
    command: ["-path", "/app/migrations", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  velis-api:
    build:
      context: ./backend
      args:
        APP: velis-api
    environment:
      <<: *backend-environment
      VELIS_HTTP_ADDRESS: 0.0.0.0:8080
    ports:
      - "8080:8080"
    depends_on:
      velis-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 15s

  velis-worker:
    build:
      context: ./backend
      args:
        APP: velis-worker
    environment: *backend-environment
    depends_on:
      velis-migrate:
        condition: service_completed_successfully
    stop_grace_period: 15s

  velis-web:
    build:
      context: ./web
    ports:
      - "5173:8080"
    depends_on:
      velis-api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.8.1
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.3.0
    profiles: ["observability"]
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  postgres-data:
  minio-data:
  grafana-data:
